kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: phi-guard
networking:
  # kind defaults, listed explicitly because the Falco egress allowlist depends on them.
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
