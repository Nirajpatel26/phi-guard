# helm upgrade --install fluent-bit fluent/fluent-bit -n logging -f detector/fluent-bit/values.yaml
# Tails only containers in the "phi" namespace and ships each line to the Presidio scanner.
config:
  service: |
    [SERVICE]
        Daemon       Off
        Flush        1
        Log_Level    info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_phi_*.log
        multiline.parser  cri, docker
        DB                /var/log/flb_phi.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  2

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           Off
        Keep_Log            On
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off

  outputs: |
    [OUTPUT]
        Name         http
        Match        kube.*
        Host         phi-scanner.logging.svc.cluster.local
        Port         8080
        URI          /ingest
        Format       json
        Retry_Limit  10
